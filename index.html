<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Reading Checklist</title>
  <style>
    /* Center everything on the page */
    html,
    body {
      height: 100%;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    .wrap {
      max-width: 600px;
      width: 100%;
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }

    .list-container ol {
      padding-left: 1rem;
    }

    .list-container li {
      margin: 0.15rem 0;
    }

    .bar {
      height: 4px;
      background: #e0e7ff;
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 0.5rem;
    }

    .bar::before {
      content: '';
      display: block;
      height: 100%;
      width: var(--p, 0%);
      background: #3b82f6;
      transition: width .2s ease;
    }

    button.reset {
      font-size: 0.8rem;
      background: none;
      border: none;
      color: #555;
      text-decoration: underline;
      cursor: pointer;
      padding: 0;
    }

    input[type="checkbox"] {
      margin-right: 0.4rem;
      vertical-align: middle;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="row">
      <p class="counter" id="fraction">0/30</p>
      <p class="sub" id="percent">(0%)</p>
      <button class="reset" id="reset" title="Clear saved progress">Reset</button>
    </div>
    <div class="bar" id="bar"></div>
    <div class="list-container">
      <ol id="list">
        <li><label><input type="checkbox" data-id="0"> The Epic of Gilgamesh — Anonymous (c. 1200 BCE)</label></li>
        <li><label><input type="checkbox" data-id="1"> The Iliad &amp; The Odyssey — Homer (c. 8th century BCE)</label>
        </li>
        <li><label><input type="checkbox" data-id="2"> The Bible — Various (various dates)</label></li>
        <li><label><input type="checkbox" data-id="3"> The Qur’an — Various (610–632 CE)</label></li>
        <li><label><input type="checkbox" data-id="4"> The Bhagavad Gita — Anonymous (c. 1st–2nd century CE)</label>
        </li>
        <li><label><input type="checkbox" data-id="5"> Tao Te Ching — Laozi (c. 4th–3rd century BCE)</label></li>
        <li><label><input type="checkbox" data-id="6"> The Analects — Confucius &amp; disciples (c.
            5th–3rd century BCE)</label></li>
        <li><label><input type="checkbox" data-id="7"> The Republic — Plato (c. 375 BCE)</label></li>
        <li><label><input type="checkbox" data-id="8"> The Art of War — Sun Tzu (c. 5th century BCE)</label></li>
        <li><label><input type="checkbox" data-id="9"> The Divine Comedy — Dante Alighieri (1308–1321)</label></li>
        <li><label><input type="checkbox" data-id="10"> The Tale of Genji — Murasaki Shikibu (c. 1008–1010)</label></li>
        <li><label><input type="checkbox" data-id="11"> Don Quixote — Miguel de Cervantes (1605/1615)</label></li>
        <li><label><input type="checkbox" data-id="12"> Hamlet — William Shakespeare (c. 1600)</label></li>
        <li><label><input type="checkbox" data-id="13"> Essays — Michel de Montaigne (1580/1588)</label></li>
        <li><label><input type="checkbox" data-id="14"> Pride and Prejudice — Jane Austen (1813)</label></li>
        <li><label><input type="checkbox" data-id="15"> Frankenstein — Mary Shelley (1818)</label></li>
        <li><label><input type="checkbox" data-id="16"> On the Origin of Species — Charles Darwin (1859)</label></li>
        <li><label><input type="checkbox" data-id="17"> The Brothers Karamazov — Fyodor Dostoevsky (1879–1880)</label>
        </li>
        <li><label><input type="checkbox" data-id="18"> War and Peace — Leo Tolstoy (1865–1869)</label></li>
        <li><label><input type="checkbox" data-id="19"> Moby‑Dick — Herman Melville (1851)</label></li>
        <li><label><input type="checkbox" data-id="20"> Middlemarch — George Eliot (1871–1872)</label></li>
        <li><label><input type="checkbox" data-id="21"> The Metamorphosis — Franz Kafka (1915)</label></li>
        <li><label><input type="checkbox" data-id="22"> In Search of Lost Time — Marcel Proust (1913–1927)</label></li>
        <li><label><input type="checkbox" data-id="23"> Ulysses — James Joyce (1922)</label></li>
        <li><label><input type="checkbox" data-id="24"> To the Lighthouse — Virginia Woolf (1927)</label></li>
        <li><label><input type="checkbox" data-id="25"> Nineteen Eighty‑Four — George Orwell (1949)</label></li>
        <li><label><input type="checkbox" data-id="26"> One Hundred Years of Solitude — Gabriel García Márquez
            (1967)</label></li>
        <li><label><input type="checkbox" data-id="27"> Things Fall Apart — Chinua Achebe (1958)</label></li>
        <li><label><input type="checkbox" data-id="28"> The Second Sex — Simone de Beauvoir (1949)</label></li>
        <li><label><input type="checkbox" data-id="29"> Beloved — Toni Morrison (1987)</label></li>
      </ol>
    </div>
  </div>
  <script>
    (function () {
      const KEY = 'readingChecklist.v1';
      const boxes = Array.from(document.querySelectorAll('input[type="checkbox"][data-id]'));
      const total = boxes.length;
      const fraction = document.getElementById('fraction');
      const percent = document.getElementById('percent');
      const bar = document.getElementById('bar');
      const resetBtn = document.getElementById('reset');
      let saved = Array(total).fill(0);
      // Load saved state
      try {
        const raw = JSON.parse(localStorage.getItem(KEY) || '[]');
        for (let i = 0; i < total; i++) saved[i] = raw[i] ? 1 : 0;
      }
      catch (e) { }
      // Apply saved state and attach listeners
      boxes.forEach(b => {
        const idx = +b.dataset.id;
        b.checked = !!saved[idx];
        b.addEventListener('change', () => {
          saved[idx] = b.checked ? 1 : 0;
          localStorage.setItem(KEY, JSON.stringify(saved));
          update();
        });
      });
      function update() {
        const done = saved.reduce((a, v) => a + (v ? 1 : 0), 0);
        const pct = Math.round((done / total) * 100);
        fraction.textContent = `${done}/${total}`;
        percent.textContent = `(${pct}%)`;
        bar.style.setProperty('--p', pct + '%');
      }
      resetBtn.addEventListener('click', () => {
        if (!confirm('Reset progress?')) return;
        saved = Array(total).fill(0);
        localStorage.setItem(KEY, JSON.stringify(saved));
        boxes.forEach(b => b.checked = false);
        update();
      });
      update();
    })();
  </script>
</body>

</html>
